<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Actipal brochure — Participant Touchpoint Tracker</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #fff;
      --border: #d8dce3;
      --text: #1a1d23;
      --muted: #5c6570;
      --accent: #1f6feb;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: max(0.75rem, env(safe-area-inset-top))
               max(0.75rem, env(safe-area-inset-right))
               max(1rem, env(safe-area-inset-bottom))
               max(0.75rem, env(safe-area-inset-left));
      line-height: 1.5;
    }
    h1 {
      margin: 0 0 0.35rem;
      font-size: clamp(1.25rem, 4vw, 1.75rem);
    }
    .nav { margin-bottom: 1rem; }
    .nav a {
      color: var(--accent);
      text-decoration: none;
      margin-right: 1rem;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .nav a:hover { text-decoration: underline; }
    .nav a.active { color: var(--text); }
    .muted {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 0 0 1rem;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .toolbar a.btn {
      background: var(--accent);
      color: #fff;
      border-radius: 6px;
      padding: 0.5rem 0.85rem;
      text-decoration: none;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .toolbar a.btn.secondary {
      background: #eaeef2;
      color: var(--text);
    }
    .brochure-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem;
      margin: 0 auto;
      max-width: 52rem;
    }
    .brochure-hint {
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      margin: 0 0 0.5rem;
    }
    .brochure-viewer {
      background: #fff;
      border-radius: 6px;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y pinch-zoom;
    }
    .brochure-image {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto;
    }
    @media (min-width: 768px) {
      body { padding: 2rem; }
      .brochure-card { padding: 1rem; }
      .brochure-hint { display: none; }
    }
  </style>
</head>
<body>
  {% set active_nav = 'brochure' %}
  {% include '_nav.html' %}

  <h1>Actipal one-pager</h1>
  <p class="muted">Study brochure for participants and collaborators.</p>

  <div class="toolbar">
    <a class="btn secondary" href="{{ url_for('static', filename='brochures/actipal-one-pager.pdf') }}" download>Download PDF</a>
  </div>

  <div class="brochure-card">
    <p class="brochure-hint">Pinch to zoom · scroll to read</p>
    <div class="brochure-viewer">
      <img
        class="brochure-image"
        src="{{ url_for('static', filename='brochures/actipal-one-pager.png') }}"
        alt="Actipal study one-pager brochure"
        width="1489"
        height="2106"
        decoding="async"
      >
    </div>
  </div>
</body>
</html>
